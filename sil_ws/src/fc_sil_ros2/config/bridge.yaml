# Gazebo Transport <-> ROS 2 mappings for the local hexacopter model.
# Sensor topics are explicitly named in models/hexacopter/model.sdf.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /fc/imu
  gz_topic_name: /fc/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: /fc/mag
  gz_topic_name: /fc/mag
  ros_type_name: sensor_msgs/msg/MagneticField
  gz_type_name: gz.msgs.Magnetometer
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: /fc/motor_cmd
  gz_topic_name: /FC_HEX/gazebo/command/motor_speed
  ros_type_name: actuator_msgs/msg/Actuators
  gz_type_name: gz.msgs.Actuators
  direction: ROS_TO_GZ
